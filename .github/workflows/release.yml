name: Release

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  release-build:
    name: Release build gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Android build container
        run: |
          docker build -f .github/docker/android-build.Dockerfile -t android-build:latest .

      - name: Run full checks (lint, tests, coverage verify)
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -v ~/.gradle:/home/gradle/.gradle \
            -w /workspace \
            android-build:latest bash -lc "printf 'sdk.dir=/opt/android-sdk\n' > local.properties && chmod +x ./gradlew && ./gradlew --no-daemon ktlintCheck build testDebugUnitTest koverXmlReport koverVerify"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-artifacts
          path: |
            **/build/outputs/**
            **/build/reports/**
