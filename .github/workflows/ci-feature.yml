name: Feature Branch CI

on:
  push:
    branches:
      - 'feature/**'
  pull_request:
    branches:
      - development

jobs:
  build-test:
    name: Lint, Build, Test, Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Android build container
        run: |
          docker build -f .github/docker/android-build.Dockerfile -t android-build:latest .

      - name: Gradle - ktlint + build + unit tests + coverage
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -v ~/.gradle:/home/gradle/.gradle \
            -w /workspace \
            android-build:latest bash -lc "printf 'sdk.dir=/opt/android-sdk\n' > local.properties && chmod +x ./gradlew && ./gradlew --no-daemon ktlintCheck build testDebugUnitTest koverXmlReport koverVerify"

      - name: Upload Coverage XML
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-xml
          path: |
            **/build/reports/kover/report.xml

      - name: Upload Test Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: |
            **/build/test-results/**
            **/build/reports/tests/**

  gate:
    name: Branch protection gates (lint + coverage)
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - name: Gates satisfied
        run: echo "Gates (ktlint + koverVerify) passed."
